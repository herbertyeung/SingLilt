name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tag version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(SingLilt VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if (-not $version) { throw 'CMake version is missing.' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") { throw 'Tag and CMake version disagree.' }
          "SINGLILT_VERSION=$version" >> $env:GITHUB_ENV
      - name: Prepare dependencies
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/setup.ps1 -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/setup-installer.ps1
      - name: Build and test
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build.ps1 -Configuration Release -CiTests
      - name: Build portable package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Zip
      - name: Build installer
        shell: pwsh
        run: pwsh -NoProfile -File scripts/installer.ps1 -PackageDirectory "build/releases/SingLilt-$env:SINGLILT_VERSION-win-x64-core"
      - name: Collect corresponding library sources
        shell: pwsh
        run: pwsh -NoProfile -File scripts/source-archives.ps1
      - name: Verify installation and uninstall
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-installer.ps1 -Installer "build/releases/SingLilt-$env:SINGLILT_VERSION-win-x64-core-setup.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            build/releases/*.zip
            build/releases/*.exe
            build/releases/*.sha256
          if-no-files-found: error
          retention-days: 14
  ubuntu-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tag version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(sed -nE 's/^project\(SingLilt VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          test -n "$version"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            printf 'Tag and CMake version disagree.\n' >&2
            exit 1
          fi
          echo "SINGLILT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install distribution libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libfluidsynth-dev \
            libtesseract-dev tesseract-ocr-eng tesseract-ocr-chi-sim fluid-soundfont-gm ffmpeg \
            fonts-dejavu-core libgl1-mesa-dev libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 patchelf xvfb xauth
      - name: Cache pinned Qt runtime
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/_deps/Qt/6.8.3/gcc_64
          key: ${{ runner.os }}-qt-6.8.3-gcc64-icu-declarative-multimedia
      - name: Prepare pinned Qt and CMake
        run: bash scripts/setup-linux.sh
      - name: Build and test Release
        run: bash scripts/build-linux.sh Release
      - name: Verify installed and extracted packages
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/tools/linux-env/bin/cmake --install build --config Release --prefix "$PWD/build/install"
          python tests/LinuxPackageTests.py build/install
          build/tools/linux-env/bin/cpack --config build/CPackConfig.cmake -C Release -B build/packages
          archive=$(find build/packages -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive" && test -s "$archive"
          mkdir -p build/unpacked
          tar -xzf "$archive" -C build/unpacked
          launcher=$(find build/unpacked -type f -path '*/bin/singlilt' -print -quit)
          test -n "$launcher"
          prefix=$(dirname "$(dirname "$launcher")")
          python tests/LinuxPackageTests.py "$prefix"
          mv build/_deps/Qt build/_deps/Qt-unavailable
          trap 'mv build/_deps/Qt-unavailable build/_deps/Qt' EXIT
          python tests/LinuxPackageTests.py build/install
          python tests/LinuxPackageTests.py "$prefix"
          test -f "$prefix/lib/singlilt/qt/plugins/platforms/libqxcb.so"
          QT_QPA_PLATFORM=xcb xvfb-run -a "$launcher" --version --language en_US
      - name: Name archive and write checksum
        shell: bash
        run: |
          archive=$(find build/packages -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive" && test -s "$archive"
          mkdir -p build/releases
          name="SingLilt-${SINGLILT_VERSION}-ubuntu-24.04-x64.tar.gz"
          cp "$archive" "build/releases/$name"
          (cd build/releases && sha256sum "$name" > "$name.sha256")
          (cd build/releases && sha256sum -c "$name.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-release
          path: |
            build/releases/*.tar.gz
            build/releases/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, ubuntu-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ubuntu-release
          path: dist
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --verify-tag --title "SingLilt ${TAG#v}" --generate-notes
