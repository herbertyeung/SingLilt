name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tag version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(SingLilt VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if (-not $version) { throw 'CMake version is missing.' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") { throw 'Tag and CMake version disagree.' }
          "SINGLILT_VERSION=$version" >> $env:GITHUB_ENV
      - name: Prepare dependencies
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/setup.ps1 -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/setup-installer.ps1
      - name: Build and test
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build.ps1 -Configuration Release -CiTests
      - name: Build portable package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Zip
      - name: Build installer
        shell: pwsh
        run: pwsh -NoProfile -File scripts/installer.ps1 -PackageDirectory "build/releases/SingLilt-$env:SINGLILT_VERSION-win-x64-core"
      - name: Collect corresponding library sources
        shell: pwsh
        run: pwsh -NoProfile -File scripts/source-archives.ps1
      - name: Verify installation and uninstall
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-installer.ps1 -Installer "build/releases/SingLilt-$env:SINGLILT_VERSION-win-x64-core-setup.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            build/releases/*.zip
            build/releases/*.exe
            build/releases/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: dist
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --draft --verify-tag --title "SingLilt ${TAG#v}" --generate-notes
